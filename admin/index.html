<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Connexion — REATM Admin</title>
<link rel="icon" href="../assets/logo.png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div class="bg-halos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="bg-grain" aria-hidden="true"></div>
<div class="bg-mark" aria-hidden="true">REATM</div>
<div class="bg-eq" id="eq" aria-hidden="true"></div>

<div class="stage">
  <div class="topbar">
    <div class="wordmark"><span class="dot"></span><b>REATM</b><span>RECORDS</span></div>
  </div>

  <div class="login-wrap">
    <form class="login-card glass" id="loginForm" novalidate>
      <div class="login-head">
        <span class="badge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4zm7 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
        </span>
        <h1>Espace d'administration</h1>
        <p>Connectez-vous pour gérer le catalogue et les événements.</p>
      </div>

      <div class="field">
        <svg class="fi" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6.5 12 13l9-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
        <input id="loginEmail" type="email" placeholder=" " autocomplete="username" required/>
        <label for="loginEmail">Adresse e-mail</label>
      </div>

      <div class="field">
        <svg class="fi" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="loginPass" type="password" placeholder=" " autocomplete="current-password" required/>
        <label for="loginPass">Mot de passe</label>
        <button type="button" class="eye" id="eyeBtn" aria-label="Afficher le mot de passe" aria-pressed="false">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>

      <div class="remember">
        <input type="checkbox" id="rememberMe"/>
        <label for="rememberMe">Rester connecté sur cet appareil</label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="label">Se connecter</span>
        <span class="spin" aria-hidden="true"></span>
        <svg class="ok-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="login-error" id="loginError" role="alert">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor"/></svg>
        <span id="loginErrorMsg">Identifiants incorrects.</span>
      </div>

      <p class="login-foot">Accès réservé à l'équipe <b>REATM RECORDS</b>.</p>
    </form>
  </div>
</div>

<script src="admin-auth.js"></script>
</body>
</html>
